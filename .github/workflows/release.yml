name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  linux:
    name: linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          set -euo pipefail
          name="hdr-merger-${VERSION}-linux-x86_64"
          mkdir -p "dist/${name}"
          cp target/x86_64-unknown-linux-gnu/release/hdr-merger "dist/${name}/"
          cp target/x86_64-unknown-linux-gnu/release/hdr-merger-gui "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
      - name: Lipo and package
        run: |
          set -euo pipefail
          name="hdr-merger-${VERSION}-macos-universal"
          mkdir -p "dist/${name}"
          for bin in hdr-merger hdr-merger-gui; do
            lipo -create -output "dist/${name}/${bin}" \
              "target/aarch64-apple-darwin/release/${bin}" \
              "target/x86_64-apple-darwin/release/${bin}"
          done
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $name = "hdr-merger-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/hdr-merger.exe" "dist/$name/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/hdr-merger-gui.exe" "dist/$name/"
          Copy-Item README.md,LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
