[package]
name = "hdr-merger-gui"
description = "Cross-platform desktop UI for the HDR / light-paint merger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hdr-merger-gui"
path = "src/main.rs"

[features]
default = []
# Software-ish fallback for machines without a working Vulkan/Metal/DX12
# adapter. Select at runtime with HDR_MERGER_RENDERER=glow.
glow-backend = ["eframe/glow"]

[dependencies]
hdr-core.workspace = true
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.29"
kamadak-exif = "0.6"
env_logger = "0.11"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
