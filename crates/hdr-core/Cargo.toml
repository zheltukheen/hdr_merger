[package]
name = "hdr-core"
description = "Headless HDR/light-paint stacking engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
image.workspace = true
kamadak-exif = "0.6"
rustfft.workspace = true
rayon.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }

[dev-dependencies]
psd = "0.3"
# Proves the streaming writer is readable by a second, independent EXR
# implementation. Already in the lockfile through `image`; dev-only.
exr = { version = "1.74", default-features = false }
